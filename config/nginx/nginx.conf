events {
    worker_connections 1024;
}

http {
    upstream selenium_hub {
        server selenium-hub:4444;
    }

    upstream selenium_nodes {
        server chrome-zapimoveis:5555;
        server chrome-olx:5555;
        server chrome-vivareal:5555;
        server chrome-headless-pool:5555;
        server firefox-node:5555;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=selenium:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # Selenium Hub
        location /selenium/ {
            limit_req zone=selenium burst=10 nodelay;
            proxy_pass http://selenium_hub/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # API endpoints
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://localhost:5000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Static files
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Health check
        location /health {
            access_log off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
}
