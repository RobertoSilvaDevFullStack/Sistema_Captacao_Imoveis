# Configuração Redis para produção
bind 0.0.0.0
port 6379
timeout 300
tcp-keepalive 60

# Configurações de memória
maxmemory 256mb
maxmemory-policy allkeys-lru

# Persistência
save 900 1
save 300 10
save 60 10000

# Configurações de rede
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Configurações de segurança
protected-mode no
requirepass scraping_redis_2024

# Logging
loglevel notice
logfile ""

# Configurações específicas para rate limiting
databases 16
