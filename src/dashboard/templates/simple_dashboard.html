<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Captação Imóveis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card-metric {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .status-good { color: #28a745; }
        .status-warning { color: #ffc107; }
        .status-error { color: #dc3545; }
        .refresh-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        .portal-card {
            transition: transform 0.2s;
        }
        .portal-card:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-home"></i> Sistema Captação Imóveis - Dashboard
            </span>
            <span class="badge bg-success" id="status-indicator">
                <i class="fas fa-circle"></i> Online
            </span>
        </div>
    </nav>

    <!-- Indicador de Refresh -->
    <div class="refresh-indicator">
        <div class="spinner-border text-primary" role="status" id="refreshSpinner" style="display: none;">
            <span class="visually-hidden">Atualizando...</span>
        </div>
    </div>

    <div class="container-fluid mt-4">
        <!-- Alertas -->
        <div id="alerts-container"></div>

        <!-- Métricas do Sistema -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card card-metric">
                    <div class="card-body text-center">
                        <i class="fas fa-clock fa-2x mb-2"></i>
                        <h5>Uptime</h5>
                        <h3 id="uptime">0h</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-metric">
                    <div class="card-body text-center">
                        <i class="fas fa-server fa-2x mb-2"></i>
                        <h5>Containers</h5>
                        <h3 id="containers">0/0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-metric">
                    <div class="card-body text-center">
                        <i class="fas fa-globe fa-2x mb-2"></i>
                        <h5>Selenium Grid</h5>
                        <h3 id="selenium-status">Offline</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card card-metric">
                    <div class="card-body text-center">
                        <i class="fas fa-database fa-2x mb-2"></i>
                        <h5>Redis</h5>
                        <h3 id="redis-status">Offline</h3>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status dos Portais -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-building"></i> Status dos Portais</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="portals-container">
                            <!-- Portais serão carregados aqui -->
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Containers -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-docker"></i> Status dos Containers</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-striped">
                                <thead>
                                    <tr>
                                        <th>Nome</th>
                                        <th>Imagem</th>
                                        <th>Status</th>
                                        <th>Portas</th>
                                    </tr>
                                </thead>
                                <tbody id="containers-table">
                                    <!-- Containers serão carregados aqui -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Performance Chart -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-chart-line"></i> Taxa de Sucesso por Portal</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="successRateChart" height="100"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let refreshInterval;
        let successRateChart;

        // Inicializar gráfico
        function initChart() {
            const ctx = document.getElementById('successRateChart').getContext('2d');
            successRateChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['ZapImóveis', 'VivaReal', 'OLX'],
                    datasets: [{
                        label: 'Taxa de Sucesso (%)',
                        data: [0, 0, 0],
                        backgroundColor: [
                            'rgba(54, 162, 235, 0.8)',
                            'rgba(255, 99, 132, 0.8)',
                            'rgba(255, 205, 86, 0.8)'
                        ],
                        borderColor: [
                            'rgba(54, 162, 235, 1)',
                            'rgba(255, 99, 132, 1)',
                            'rgba(255, 205, 86, 1)'
                        ],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 100
                        }
                    }
                }
            });
        }

        // Atualizar dados
        async function refreshData() {
            document.getElementById('refreshSpinner').style.display = 'block';
            
            try {
                // Buscar estatísticas do sistema
                const statsResponse = await fetch('/api/stats');
                const stats = await statsResponse.json();
                
                // Atualizar métricas do sistema
                document.getElementById('uptime').textContent = stats.system.uptime_hours + 'h';
                document.getElementById('containers').textContent = 
                    stats.system.containers_running + '/' + stats.system.total_containers;
                
                // Status Selenium Grid
                const seleniumElement = document.getElementById('selenium-status');
                if (stats.selenium_grid.status === 'online') {
                    seleniumElement.textContent = 'Online (' + stats.selenium_grid.nodes + ' nós)';
                    seleniumElement.className = 'status-good';
                } else {
                    seleniumElement.textContent = 'Offline';
                    seleniumElement.className = 'status-error';
                }
                
                // Status Redis
                const redisElement = document.getElementById('redis-status');
                if (stats.system.redis_connected) {
                    redisElement.textContent = 'Conectado';
                    redisElement.className = 'status-good';
                } else {
                    redisElement.textContent = 'Desconectado';
                    redisElement.className = 'status-error';
                }

                // Buscar dados dos portais
                const portalsResponse = await fetch('/api/portals');
                const portals = await portalsResponse.json();
                
                updatePortals(portals);
                updateChart(portals);

                // Buscar containers
                const containersResponse = await fetch('/api/containers');
                const containers = await containersResponse.json();
                
                updateContainers(containers);

            } catch (error) {
                console.error('Erro ao atualizar dados:', error);
                showAlert('Erro ao carregar dados: ' + error.message, 'danger');
            }
            
            document.getElementById('refreshSpinner').style.display = 'none';
        }

        // Atualizar portais
        function updatePortals(portals) {
            const container = document.getElementById('portals-container');
            container.innerHTML = '';
            
            Object.keys(portals).forEach(portalName => {
                const portal = portals[portalName];
                const statusClass = portal.health_status === 'good' ? 'success' : 
                                   portal.health_status === 'warning' ? 'warning' : 'danger';
                
                const portalCard = `
                    <div class="col-md-4 mb-3">
                        <div class="card portal-card border-${statusClass}">
                            <div class="card-body">
                                <h6 class="card-title">
                                    <i class="fas fa-building"></i> ${portal.portal.toUpperCase()}
                                </h6>
                                <p class="mb-1">
                                    <strong>Requisições:</strong> ${portal.total_requests}
                                </p>
                                <p class="mb-1">
                                    <strong>Taxa Sucesso:</strong> ${portal.success_rate.toFixed(1)}%
                                </p>
                                <p class="mb-1">
                                    <strong>Imóveis:</strong> ${portal.properties_scraped}
                                </p>
                                <p class="mb-0">
                                    <strong>Bloqueios:</strong> ${portal.blocked_requests}
                                </p>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += portalCard;
            });
        }

        // Atualizar gráfico
        function updateChart(portals) {
            const data = [
                portals.zapimoveis?.success_rate || 0,
                portals.vivareal?.success_rate || 0,
                portals.olx?.success_rate || 0
            ];
            
            successRateChart.data.datasets[0].data = data;
            successRateChart.update();
        }

        // Atualizar containers
        function updateContainers(containers) {
            const tbody = document.getElementById('containers-table');
            tbody.innerHTML = '';
            
            containers.forEach(container => {
                const statusClass = container.status === 'running' ? 'success' : 'danger';
                const ports = Object.keys(container.ports).join(', ') || 'N/A';
                
                const row = `
                    <tr>
                        <td>${container.name}</td>
                        <td><code>${container.image}</code></td>
                        <td><span class="badge bg-${statusClass}">${container.status}</span></td>
                        <td>${ports}</td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        }

        // Mostrar alerta
        function showAlert(message, type = 'info') {
            const alertsContainer = document.getElementById('alerts-container');
            const alert = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            alertsContainer.innerHTML += alert;
            
            // Auto-dismiss após 5 segundos
            setTimeout(() => {
                const alerts = alertsContainer.querySelectorAll('.alert');
                if (alerts.length > 0) {
                    alerts[0].remove();
                }
            }, 5000);
        }

        // Inicializar dashboard
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            refreshData();
            
            // Auto-refresh a cada 30 segundos
            refreshInterval = setInterval(refreshData, 30000);
            
            showAlert('Dashboard carregado com sucesso!', 'success');
        });

        // Cleanup
        window.addEventListener('beforeunload', function() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
            }
        });
    </script>
</body>
</html>
